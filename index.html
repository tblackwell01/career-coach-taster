<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factors of Career Choice© — Full Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A5C;--navy-dark:#0F2640;--navy-mid:#1a3352;--navy-light:#244d7a;
  --gold:#C9A84C;--gold-light:#E8C878;--gold-dim:#8a6e2a;
  --cream:#F8F4EE;--cream-dark:#EDE7DC;--cream-mid:#F2EDE4;
  --text:#1a1a2e;--text-muted:#5a6a7e;--text-light:#8a9aaa;
  --white:#ffffff;
  --shadow-sm:0 2px 12px rgba(27,58,92,0.08);
  --shadow-md:0 4px 32px rgba(27,58,92,0.12);
  --shadow-lg:0 12px 48px rgba(27,58,92,0.18);
  --shadow-xl:0 24px 80px rgba(27,58,92,0.22);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(27,58,92,0.04) 0%,transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(201,168,76,0.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 24px 100px}

.header{padding:52px 0 44px;text-align:center}
.brand-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:20px;padding:5px 14px;margin-bottom:20px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.brand-text{font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold)}
.header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,46px);font-weight:300;color:var(--navy-dark);line-height:1.1;margin-bottom:10px;letter-spacing:-0.01em}
.header h1 em{font-style:italic;color:var(--navy)}
.header h1 sup{font-size:0.5em;vertical-align:super;color:var(--gold)}
.header-sub{font-size:15px;color:var(--text-muted);line-height:1.65;max-width:460px;margin:0 auto}
.gold-rule{display:flex;align-items:center;gap:12px;margin:20px auto 0;max-width:160px}
.gold-rule::before,.gold-rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.gold-rule-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0}

.chapter-progress{margin-bottom:36px}
.chapter-tabs{display:flex;gap:4px;margin-bottom:12px}
.chapter-tab{flex:1;padding:8px 4px;text-align:center;font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-light);border-bottom:2px solid var(--cream-dark);transition:all 0.3s ease}
.chapter-tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.chapter-tab.done{color:var(--gold);border-bottom-color:var(--gold)}
.progress-bar{height:2px;background:var(--cream-dark);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:2px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.progress-text{font-size:11px;color:var(--text-light);margin-top:6px;text-align:right}

.card{background:var(--white);border-radius:20px;padding:40px;box-shadow:var(--shadow-md);margin-bottom:20px;border:1px solid rgba(201,168,76,0.08)}
.card-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-eyebrow-num{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--white);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.card h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--navy-dark);margin-bottom:10px;line-height:1.3}
.subprompt{font-size:13px;color:var(--text-muted);font-style:italic;margin-bottom:22px;line-height:1.6;padding-left:12px;border-left:2px solid var(--cream-dark)}

.intake-question{margin-bottom:28px}
.intake-label{font-size:14px;font-weight:500;color:var(--navy-dark);margin-bottom:12px;line-height:1.4}
.intake-options{display:flex;flex-wrap:wrap;gap:8px}
.intake-option{padding:8px 16px;border-radius:24px;font-size:13px;color:var(--text-muted);border:1.5px solid var(--cream-dark);background:var(--cream);cursor:pointer;transition:all 0.2s ease;user-select:none}
.intake-option:hover{border-color:var(--navy-light);color:var(--navy)}
.intake-option.selected{background:var(--navy);color:var(--white);border-color:var(--navy)}

textarea{width:100%;min-height:120px;padding:16px 18px;border:1.5px solid var(--cream-dark);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);background:var(--cream-mid);resize:vertical;line-height:1.65;outline:none;transition:all 0.2s ease}
textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,92,0.07);background:var(--white)}
textarea::placeholder{color:#b8c4d0}
.char-count{font-size:11px;color:var(--text-light);text-align:right;margin-top:5px}

.btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s ease}
.btn-navy{background:var(--navy);color:var(--white);box-shadow:0 4px 16px rgba(27,58,92,0.2)}
.btn-navy:hover{background:var(--navy-light);transform:translateY(-1px)}
.btn-navy:disabled{opacity:0.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--cream-dark)}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy-dark);box-shadow:0 4px 16px rgba(201,168,76,0.25)}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-full{width:100%;font-size:15px;padding:15px 28px}

.ai-box{background:linear-gradient(145deg,var(--navy-dark) 0%,var(--navy-mid) 100%);border-radius:16px;padding:28px 32px;color:var(--white);margin-top:20px;position:relative;overflow:hidden}
.ai-box::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(201,168,76,0.06);pointer-events:none}
.ai-label{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ai-pulse{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
.ai-box p{font-size:15px;line-height:1.8;color:rgba(255,255,255,0.88);margin-bottom:14px}
.ai-box p:last-child{margin-bottom:0}

.action-step{background:rgba(201,168,76,0.09);border:1px solid rgba(201,168,76,0.2);border-radius:12px;padding:16px 20px;margin-top:16px}
.action-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px;font-weight:500}
.action-text{font-size:13px;color:var(--navy-dark);line-height:1.6}

.chapter-card{background:linear-gradient(145deg,var(--navy-dark),var(--navy-light));border-radius:20px;padding:48px 40px;text-align:center;color:var(--white);box-shadow:var(--shadow-xl);margin-bottom:20px}
.chapter-num{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(201,168,76,0.7);margin-bottom:16px}
.chapter-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--white);margin-bottom:12px}
.chapter-title em{font-style:italic;color:var(--gold-light)}
.chapter-desc{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.7;max-width:380px;margin:0 auto 24px}
.factor-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.factor-chip{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.15)}

.synth-card{background:linear-gradient(145deg,var(--navy-dark),var(--navy-light));border-radius:20px;padding:44px 40px;color:var(--white);box-shadow:var(--shadow-xl);margin-bottom:20px;position:relative;overflow:hidden}
.synth-card::before{content:'';position:absolute;bottom:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:rgba(201,168,76,0.06)}
.synth-card::after{content:'';position:absolute;top:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:rgba(201,168,76,0.04)}
.synth-eyebrow{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;position:relative;z-index:1}
.synth-card h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;color:var(--white);margin-bottom:20px;line-height:1.2;position:relative;z-index:1}
.synth-body{font-size:15px;line-height:1.85;color:rgba(255,255,255,0.85);position:relative;z-index:1}
.synth-body p{margin-bottom:18px}
.synth-body p:last-child{margin-bottom:0}

.cta{background:var(--white);border-radius:20px;padding:44px 40px;text-align:center;box-shadow:var(--shadow-md);margin-top:20px;border:1px solid rgba(201,168,76,0.12)}
.cta h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:var(--navy-dark);margin-bottom:12px}
.cta p{font-size:14px;color:var(--text-muted);line-height:1.65;margin-bottom:20px;max-width:420px;margin-left:auto;margin-right:auto}
.factor-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.factor-tag{padding:6px 14px;background:var(--cream);border-radius:20px;font-size:12px;color:var(--text-muted);border:1px solid var(--cream-dark)}
.factor-tag.done{background:var(--navy);color:var(--white);border-color:var(--navy)}
.cta-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* WELCOME — with diagram image */
.welcome{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(201,168,76,0.08)}
.welcome-diagram{width:100%;display:block;border-bottom:1px solid rgba(201,168,76,0.12)}
.welcome-body{padding:40px}
.welcome h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:var(--navy-dark);margin-bottom:10px;line-height:1.2}
.welcome-lead{font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:12px}
.expect-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.expect-item{background:var(--cream);border-radius:10px;padding:12px 14px}
.expect-item-label{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px;font-weight:500}
.expect-item-val{font-size:12px;color:var(--text-muted);line-height:1.4}

.resume-banner{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.resume-text{font-size:13px;color:var(--navy-dark)}

.intake-card{background:var(--white);border-radius:20px;padding:40px;box-shadow:var(--shadow-md);border:1px solid rgba(201,168,76,0.08)}
.intake-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--navy-dark);margin-bottom:6px}
.intake-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:28px;line-height:1.5}

.dots{display:flex;gap:5px;padding:6px 0}
.dots span{width:7px;height:7px;background:rgba(255,255,255,0.45);border-radius:50%;animation:bounce 1.4s infinite}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite}

.disclaimer{text-align:center;font-size:11px;color:var(--text-light);margin-top:36px;line-height:1.7;opacity:0.65}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.5s ease both}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand-pill"><div class="brand-dot"></div><span class="brand-text">Layers Not Linear &nbsp;&middot;&nbsp; Tyler Blackwell</span></div>
    <h1>Factors of Career Choice<sup>&copy;</sup></h1>
    <p class="header-sub">A full seven-factor experience. Personalized AI coaching grounded in behavioral science.</p>
    <div class="gold-rule"><div class="gold-rule-dot"></div></div>
  </div>
  <div id="root"></div>
  <p class="disclaimer">Built on the Factors of Career Choice&copy; framework by Tyler Blackwell &nbsp;&middot;&nbsp; Your answers are saved locally and never shared &nbsp;&middot;&nbsp; careerprint.co</p>
</div>

<script>
var PROXY='https://career-coach-proxy.tcblackwell.workers.dev';
var SAVE_KEY='fcc_v1_state';

var FACTORS=[
  {id:'abilities',num:1,chapter:1,name:'Abilities',question:'What are you naturally good at \u2014 before anyone taught you?',sub:'Think about what has always come easily to you. Not skills you worked hard to build, but the capacities that were already there. The way you think, connect ideas, listen, lead, create, or see patterns others miss. What do people ask for your help with, unprompted?',ph:'Take your time. There is no right answer here. Just write what comes to mind...',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework developed by Tyler Blackwell. The user is reflecting on their natural Abilities \u2014 what they are innately oriented toward before anyone taught them. Use the intake context provided to personalize your response. Reflect back what you hear, name the ability underneath their words with precision, and offer one insight that helps them see themselves more clearly. Be warm, specific, and grounded. No generic praise. No lists. Write 2\u20133 short paragraphs in flowing prose. End with one question that deepens their reflection. Keep under 210 words.',action:'This week, notice one moment when a task felt completely effortless \u2014 when time disappeared and you forgot to check your phone. Write down what you were actually doing in that moment. That is data.'},
  {id:'skills',num:2,chapter:1,name:'Skills',question:'Which skills did you choose \u2014 and which chose you?',sub:'Skills are built, not born. Some you pursued because you genuinely wanted to. Others developed because circumstance, obligation, or necessity required it. Think about the skills you have accumulated. Which ones feel like yours? Which ones feel like a role you were assigned?',ph:'Think about the skills that energize you versus the ones that drain you, even when you do them well...',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework. The user is reflecting on their Skills \u2014 distinguishing between skills built by desire versus obligation. Use the intake context to personalize. Reflect what you hear, name the distinction between chosen and obligated skills, and help them see which skills align with who they actually are. Be warm, precise, and direct. No lists. Write 2\u20133 short paragraphs. End with one question. Keep under 210 words.',action:'List your three most-used skills at work. Next to each one, write a single word: chose or inherited. If you inherited more than you chose, that is worth sitting with.'},
  {id:'interests',num:3,chapter:1,name:'Interests',question:'What draws your attention \u2014 and has that changed?',sub:'Interests are not fixed. They evolve, go underground, find new expressions, or reveal what they were always pointing at. Think about what genuinely captures your curiosity right now \u2014 and whether that is different from what drew you five or ten years ago.',ph:'What do you find yourself reading about, talking about, or thinking about when nobody is watching?',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework. The user is reflecting on their Interests \u2014 what draws their attention and how that has evolved. Use intake context to personalize. Note whether their interests appear to be evolving within a domain or pointing toward something deeper across domains. Be warm and specific. No lists. Write 2\u20133 short paragraphs. End with one question. Keep under 210 words.',action:'Think of something you used to be deeply interested in that you have set aside. Ask yourself: did the interest actually die, or did it go underground? Where might it be pointing now?'},
  {id:'values',num:4,chapter:2,name:'Values',question:'What does your career actually reflect about what you believe matters?',sub:'Values reveal themselves in the moments that cost something. The meeting where you said nothing and drove home unsettled. The offer you turned down without fully explaining why. The role you stayed in longer than you should have. What do those moments tell you?',ph:'Think about a recent moment when something at work felt wrong, even if you could not name why...',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework. The user is reflecting on their Values \u2014 both ethical values and life-stage values. Use intake context carefully. If they indicated their values feel tested, acknowledge that. Be warm, precise, and honest. Help them see the difference between what they say they value and what their decisions reflect. No lists. Write 2\u20133 paragraphs. End with one question. Keep under 220 words.',action:'Write down two or three moments in your career when you felt genuinely proud. Then two or three moments when something felt deeply wrong. Your values are almost always visible in both kinds of reactions before they are visible in reflection.'},
  {id:'family',num:5,chapter:2,name:'Family',question:'What script did your family hand you \u2014 and how much of it are you still performing?',sub:'Your family of origin gave you a set of beliefs about work, ambition, money, and what kinds of lives are possible \u2014 before you were old enough to question them. And the family you have built is shaping the decisions you make right now. Both deserve honest examination.',ph:'What did success, failure, money, or ambition mean in your family growing up? What was celebrated? What was feared?',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework, developed with Richard Blackwell PhD, a psychologist with 50 years of practice. The user is reflecting on the Family factor \u2014 the unspoken scripts of family of origin, and the influence of the family they have built. Use intake context. Name the pattern or script you observe. Help them see what was inherited versus what was chosen. Be warm, careful, and honest. Do not be clinical. No lists. Write 2\u20133 paragraphs. End with one gentle question. Keep under 230 words.',action:'Identify one belief about work or success that you received from your family of origin. Ask yourself: do I still believe this? Did I ever actually choose it? What would I believe if I were starting from scratch?'},
  {id:'goals',num:6,chapter:3,name:'Goals',question:'Where are you going \u2014 and who decided that?',sub:'Most people can describe their career goals. Far fewer have examined whether those goals are actually theirs \u2014 or whether they were inherited from a parent, absorbed from a peer group, or arrived at by default because they were the next logical step on a path they never consciously chose.',ph:'What are you working toward right now? When did you decide that? Have you ever questioned it?',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework. The user is reflecting on their Goals \u2014 specifically whether the direction they are pursuing was consciously chosen or inherited and unexamined. Use intake context. Be warm and precise. No lists. Write 2\u20133 paragraphs. End with one question. Keep under 210 words.',action:'Write down your single most important professional goal right now. Then answer: when did I decide this? Did I choose it or did I drift into it? If I could choose freely with no constraints, would I choose the same thing?'},
  {id:'developmental_stage',num:7,chapter:3,name:'Developmental Stage',question:'What does this specific moment of your life actually require?',sub:'Career decisions do not happen in a vacuum. They happen at a particular moment \u2014 with a particular set of circumstances, relationships, responsibilities, and energies. What this moment requires may be different from what the last chapter required, or what the next one will.',ph:'What is this season of your life asking of you that is different from five years ago?',sys:'You are a thoughtful career coach trained in the Factors of Career Choice framework. The user is reflecting on Developmental Stage \u2014 how their life circumstances, age, responsibilities, and energy shape what career decisions make sense right now. Use intake context fully here. Help them see what this specific moment is asking for, without judgment. Be warm, grounded, and honest. No lists. Write 2\u20133 paragraphs. End with one question. Keep under 220 words.',action:'Write one sentence about what this chapter of your life needs most right now \u2014 not what you think you should want, but what this season genuinely requires. Then ask: are my career decisions aligned with that?'}
];

var CHAPTERS=[
  {num:1,name:'Who You Are',factors:['abilities','skills','interests'],desc:'The raw material of a person \u2014 what you were born oriented toward, what you have built, and what draws your attention.'},
  {num:2,name:'What Shapes You',factors:['values','family'],desc:'The deeper influences \u2014 your internal compass, and the families that handed you your first map of the world.'},
  {num:3,name:'Where You Are Going',factors:['goals','developmental_stage'],desc:'Direction and timing \u2014 what you are working toward, and what this specific moment of your life requires.'}
];

var INTAKE_QUESTIONS=[
  {id:'age',label:'How old are you?',options:['Under 25','26\u201335','36\u201345','46\u201355','56+']},
  {id:'reason',label:'What brings you here today?',options:['Exploring a career change','Feeling stuck in my current role','Early career, figuring out direction','Navigating a major life transition','Just curious about myself']},
  {id:'employed',label:'Are you currently working?',options:['Yes, employed','Self-employed or freelance','Between roles right now']},
  {id:'values_tested',label:'Have you felt recently that something important to you is being compromised at work?',options:['Yes','No','Not sure']},
  {id:'life_change',label:'Has something significant changed in your life in the last year?',options:['Yes \u2014 relationship or family','Yes \u2014 job or career','Yes \u2014 health or loss','No major changes']}
];

function loadState(){try{var s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function saveState(s){try{localStorage.setItem(SAVE_KEY,JSON.stringify(s))}catch(e){}}
function clearState(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

var state={screen:'welcome',intake:{},intakeComplete:false,currentFactor:0,currentChapter:1,responses:{},reflections:{},actionSteps:{},chapterSeen:{},synthText:'',resumable:false};
var saved=loadState();
if(saved&&saved.intakeComplete&&Object.keys(saved.responses).length>0){state=saved;state.resumable=true;}

function save(){saveState(state)}
function r(){document.getElementById('root').innerHTML='';render();window.scrollTo(0,0)}

function render(){
  var root=document.getElementById('root');
  root.innerHTML='';
  if(state.screen==='welcome'){drawWelcome(root);return}
  if(state.screen==='intake'){drawIntake(root);return}
  if(state.screen==='chapter'){drawChapter(root);return}
  if(state.screen==='factor'){drawFactor(root);return}
  if(state.screen==='synthesis'){drawSynthesis(root);return}
}

function drawWelcome(root){
  var resumeHtml='';
  if(state.resumable){
    var done=Object.keys(state.responses).length;
    resumeHtml='<div class="resume-banner fade-in"><span class="resume-text">You completed <b>'+done+' of 7</b> factors. Pick up where you left off.</span><button class="btn btn-gold" id="resume-btn" style="padding:8px 18px;font-size:13px;flex-shrink:0;">Continue</button></div>';
  }
  root.innerHTML=resumeHtml+
    '<div class="welcome fade-in">'+
    '<img src="factors-diagram.png" alt="Factors of Career Choice diagram showing all seven factors: Abilities, Skills, Interests, Values, Goals, Family, and Developmental Stage arranged in an interconnected circle around Career Identity" class="welcome-diagram">'+
    '<div class="welcome-body">'+
    '<h2>Where did your career come from?</h2>'+
    '<p class="welcome-lead">Most career tools tell you what to do next. This one asks something harder: who are you, what shaped you, and are the choices you are making actually yours?</p>'+
    '<p class="welcome-lead">Seven factors. Real AI coaching. Personalized to your specific situation. About 25 minutes.</p>'+
    '<div class="expect-grid">'+
    '<div class="expect-item"><div class="expect-item-label">Framework</div><div class="expect-item-val">Factors of Career Choice&copy; by Tyler Blackwell</div></div>'+
    '<div class="expect-item"><div class="expect-item-label">Chapters</div><div class="expect-item-val">3 chapters, 7 factors, personalized throughout</div></div>'+
    '<div class="expect-item"><div class="expect-item-label">AI coaching</div><div class="expect-item-val">Real reflection after every factor</div></div>'+
    '<div class="expect-item"><div class="expect-item-label">Progress saved</div><div class="expect-item-val">Return anytime, pick up where you left off</div></div>'+
    '</div>'+
    '<button class="btn btn-navy btn-full" id="start-btn">Begin the experience &nbsp;&#x2192;</button>'+
    '</div></div>';
  document.getElementById('start-btn').onclick=function(){state.screen='intake';state.resumable=false;save();r()};
  if(state.resumable){document.getElementById('resume-btn').onclick=function(){state.resumable=false;state.screen='factor';save();r()}}
}

function drawIntake(root){
  var html='<div class="intake-card fade-in">'+
    '<div class="card-eyebrow">Quick context</div>'+
    '<div class="intake-title">Tell me a little about where you are</div>'+
    '<p class="intake-subtitle">Five quick questions. Your answers shape every reflection you receive across all seven factors.</p>';
  for(var i=0;i<INTAKE_QUESTIONS.length;i++){
    var q=INTAKE_QUESTIONS[i];
    html+='<div class="intake-question"><div class="intake-label">'+(i+1)+'. '+q.label+'</div><div class="intake-options" id="opts-'+q.id+'">';
    for(var j=0;j<q.options.length;j++){
      var sel=state.intake[q.id]===q.options[j]?' selected':'';
      html+='<div class="intake-option'+sel+'" data-q="'+q.id+'" data-v="'+encodeURIComponent(q.options[j])+'">'+q.options[j]+'</div>';
    }
    html+='</div></div>';
  }
  html+='<div class="btn-row"><button class="btn btn-navy btn-full" id="intake-submit" style="margin-top:8px;" disabled>Start my experience &nbsp;&#x2192;</button></div></div>';
  root.innerHTML=html;
  root.querySelectorAll('.intake-option').forEach(function(el){
    el.onclick=function(){
      var q=this.getAttribute('data-q');
      var v=decodeURIComponent(this.getAttribute('data-v'));
      state.intake[q]=v;
      root.querySelectorAll('.intake-option[data-q="'+q+'"]').forEach(function(o){o.classList.remove('selected')});
      this.classList.add('selected');
      save();
      document.getElementById('intake-submit').disabled=Object.keys(state.intake).length<INTAKE_QUESTIONS.length;
    }
  });
  document.getElementById('intake-submit').onclick=function(){
    state.intakeComplete=true;state.screen='chapter';state.currentChapter=1;state.currentFactor=0;save();r();
  }
}

function intakeSummary(){
  var parts=[];
  if(state.intake.age)parts.push('Age range: '+state.intake.age);
  if(state.intake.reason)parts.push('Here because: '+state.intake.reason);
  if(state.intake.employed)parts.push('Work status: '+state.intake.employed);
  if(state.intake.values_tested)parts.push('Values feeling tested at work: '+state.intake.values_tested);
  if(state.intake.life_change)parts.push('Recent life change: '+state.intake.life_change);
  return parts.join('. ');
}

function drawChapter(root){
  var ch=CHAPTERS[state.currentChapter-1];
  var chips=ch.factors.map(function(fid){
    var f=FACTORS.find(function(x){return x.id===fid});
    return '<div class="factor-chip">'+f.name+'</div>';
  }).join('');
  root.innerHTML='<div class="chapter-card fade-in">'+
    '<div class="chapter-num">Chapter '+ch.num+' of 3</div>'+
    '<div class="chapter-title"><em>'+ch.name+'</em></div>'+
    '<p class="chapter-desc">'+ch.desc+'</p>'+
    '<div class="factor-chips">'+chips+'</div>'+
    '<button class="btn btn-gold" id="ch-btn" style="padding:14px 36px;font-size:15px;">Begin chapter '+ch.num+' &nbsp;&#x2192;</button>'+
    '</div>';
  document.getElementById('ch-btn').onclick=function(){state.chapterSeen[state.currentChapter]=true;state.screen='factor';save();r()}
}

function getCurrentFactor(){return FACTORS[state.currentFactor]}

function drawFactor(root){
  var f=getCurrentFactor();
  var totalDone=Object.keys(state.responses).length;
  var pct=Math.round((totalDone/7)*100);
  var chTabs='';
  for(var i=0;i<CHAPTERS.length;i++){
    var ch=CHAPTERS[i];
    var cls=ch.num<state.currentChapter?'done':ch.num===state.currentChapter?'active':'';
    chTabs+='<div class="chapter-tab '+cls+'">Ch '+ch.num+': '+ch.name+'</div>';
  }
  root.innerHTML=
    '<div class="chapter-progress fade-in">'+
    '<div class="chapter-tabs">'+chTabs+'</div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="progress-text">Factor '+f.num+' of 7</div>'+
    '</div>'+
    '<div class="card fade-in">'+
    '<div class="card-eyebrow"><div class="card-eyebrow-num">'+f.num+'</div>'+f.name+'</div>'+
    '<h2>'+f.question+'</h2>'+
    '<p class="subprompt">'+f.sub+'</p>'+
    '<textarea id="ta" rows="5" placeholder="'+f.ph+'"></textarea>'+
    '<div class="char-count" id="cc">0 characters \u2014 write at least 30 to continue</div>'+
    '<div class="btn-row">'+
    (state.currentFactor>0?'<button class="btn btn-ghost" id="back-btn">&#x2190; Back</button>':'')+
    '<button class="btn btn-navy" id="submit-btn" disabled>Get my reflection &nbsp;&#x2192;</button>'+
    '</div></div>'+
    '<div id="rarea"></div>';
  var ta=document.getElementById('ta');
  var sb=document.getElementById('submit-btn');
  var cc=document.getElementById('cc');
  if(state.responses[f.id]){
    ta.value=state.responses[f.id];
    cc.textContent=ta.value.trim().length+' characters';
    sb.disabled=false;
    if(state.reflections[f.id]){showRefl(state.reflections[f.id],state.actionSteps[f.id],f)}
  }
  ta.oninput=function(){
    var l=ta.value.trim().length;
    cc.textContent=l+' characters'+(l<30?' \u2014 write at least 30 to continue':'');
    sb.disabled=l<30;
  };
  sb.onclick=function(){doSubmit(f)};
  if(state.currentFactor>0){
    document.getElementById('back-btn').onclick=function(){state.currentFactor--;save();r()}
  }
}

function doSubmit(f){
  var ta=document.getElementById('ta');
  var text=ta.value.trim();
  if(text.length<30)return;
  state.responses[f.id]=text;save();
  var sb=document.getElementById('submit-btn');
  sb.disabled=true;sb.innerHTML='<span class="spinner"></span> Reflecting...';ta.disabled=true;
  document.getElementById('rarea').innerHTML='<div class="ai-box fade-in"><div class="ai-label"><div class="ai-pulse"></div>Reflecting on your '+f.name+'</div><div class="dots"><span></span><span></span><span></span></div></div>';
  var prompt='Context about this person: '+intakeSummary()+'\n\nTheir response to the '+f.name+' factor: '+text;
  fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:f.sys,messages:[{role:'user',content:prompt}]})})
  .then(function(res){return res.json()})
  .then(function(data){
    if(data.error)throw new Error(JSON.stringify(data.error));
    var txt=data.content&&data.content[0]&&data.content[0].text;
    if(!txt)throw new Error('No content');
    state.reflections[f.id]=txt;state.actionSteps[f.id]=f.action;save();
    showRefl(txt,f.action,f);
  })
  .catch(function(err){
    document.getElementById('rarea').innerHTML='<div class="ai-box fade-in"><div class="ai-label">Error</div><p>'+err.message+'</p></div>';
    sb.disabled=false;sb.innerHTML='Get my reflection &nbsp;&#x2192;';ta.disabled=false;
  });
}

function showRefl(txt,action,f){
  var paras=txt.split('\n\n').map(function(p){return'<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('');
  var ch=CHAPTERS.find(function(c){return c.num===f.chapter});
  var isLastInChapter=ch&&ch.factors[ch.factors.length-1]===f.id;
  var isLastFactor=f.num===7;
  var nextBtn='';
  if(isLastFactor){
    nextBtn='<button class="btn btn-gold" id="next-btn" style="flex:1;justify-content:center;">See my full portrait &nbsp;&#x2192;</button>';
  }else if(isLastInChapter){
    var nextCh=CHAPTERS.find(function(c){return c.num===f.chapter+1});
    nextBtn='<button class="btn btn-navy" id="next-btn" style="flex:1;justify-content:center;">Continue to Chapter '+(f.chapter+1)+': '+nextCh.name+' &nbsp;&#x2192;</button>';
  }else{
    var nextF=FACTORS[f.num];
    nextBtn='<button class="btn btn-navy" id="next-btn" style="flex:1;justify-content:center;">Continue to '+nextF.name+' &nbsp;&#x2192;</button>';
  }
  document.getElementById('rarea').innerHTML=
    '<div class="ai-box fade-in"><div class="ai-label"><div class="ai-pulse"></div>Your reflection on '+f.name+'</div>'+paras+'</div>'+
    '<div class="action-step fade-in"><div class="action-label">Suggested action step</div><div class="action-text">'+action+'</div></div>'+
    '<div class="btn-row" style="margin-top:16px;">'+nextBtn+'</div>';
  document.getElementById('next-btn').onclick=function(){
    if(isLastFactor){state.screen='synthesis';save();r();}
    else if(isLastInChapter){state.currentFactor=f.num;state.currentChapter=f.chapter+1;state.screen='chapter';save();r();}
    else{state.currentFactor=f.num;save();r();}
  }
}

function drawSynthesis(root){
  if(state.synthText){showSynthResult(root,state.synthText);return}
  root.innerHTML='<div class="synth-card fade-in"><div class="synth-eyebrow">Your complete portrait</div><h2>Bringing all seven factors together...</h2><div class="dots" style="margin-top:12px;"><span style="background:rgba(255,255,255,0.35)"></span><span style="background:rgba(255,255,255,0.35)"></span><span style="background:rgba(255,255,255,0.35)"></span></div></div>';
  var ctx=intakeSummary();
  var responses='';
  FACTORS.forEach(function(f){responses+=f.name.toUpperCase()+': '+(state.responses[f.id]||'Not provided')+'\n\n';});
  var prompt='Context about this person: '+ctx+'\n\nHere are their responses to all seven Factors of Career Choice:\n\n'+responses+'Synthesize all seven into a complete integrated portrait. Find the thread running through all seven answers, name tensions worth noting, and show what becomes visible together that was not visible separately. Write 4-5 paragraphs in warm intelligent prose. No lists. Be specific. End with one honest generous observation about where this person might find the most meaning. Keep under 400 words.';
  fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:prompt}]})})
  .then(function(res){return res.json()})
  .then(function(data){
    if(data.error)throw new Error(JSON.stringify(data.error));
    var txt=data.content&&data.content[0]&&data.content[0].text;
    if(!txt)throw new Error('No content');
    state.synthText=txt;save();showSynthResult(root,txt);
  })
  .catch(function(err){
    root.innerHTML='<div class="card"><p style="color:var(--text-muted)">Unable to generate portrait: '+err.message+'</p><div class="btn-row"><button class="btn btn-ghost" id="retry-btn">Try again</button></div></div>';
    document.getElementById('retry-btn').onclick=function(){state.synthText='';r()};
  });
}

function showSynthResult(root,txt){
  var paras=txt.split('\n\n').map(function(p){return'<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('');
  var tags=FACTORS.map(function(f){return'<div class="factor-tag done">&#10003; '+f.name+'</div>'}).join('');
  root.innerHTML=
    '<div class="synth-card fade-in"><div class="synth-eyebrow">Your seven-factor portrait &nbsp;&middot;&nbsp; Factors of Career Choice&copy;</div><h2>What your answers reveal</h2><div class="synth-body">'+paras+'</div></div>'+
    '<div class="cta fade-in">'+
    '<h3>You have done something rare.</h3>'+
    '<p>Most people never examine all seven factors at once. You just did. That kind of honest self-examination is where real career clarity starts.</p>'+
    '<div class="factor-tags">'+tags+'</div>'+
    '<p style="font-style:italic;color:var(--text-light);margin-bottom:24px;font-size:13px;">The full career coaching app is in development. Follow Layers Not Linear to be the first to know when it launches.</p>'+
    '<div class="cta-btns">'+
    '<button class="btn btn-navy" id="sub-btn">Follow Layers Not Linear</button>'+
    '<button class="btn btn-ghost" id="restart-btn">Start over</button>'+
    '</div></div>';
  document.getElementById('sub-btn').onclick=function(){window.open('https://layersnotlinear.substack.com','_blank')};
  document.getElementById('restart-btn').onclick=function(){clearState();location.reload()};
}

render();
</script>
</body>
</html>
